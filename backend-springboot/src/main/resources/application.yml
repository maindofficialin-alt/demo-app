server:
  port: 8080

spring:
  application:
    name: supply-chain-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/supplychain_db
    username: supplychain_user
    password: supplychain_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: supply-chain-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.azure-iam.net/oauth2
          jwk-set-uri: https://auth.azure-iam.net/oauth2/.well-known/jwks.json
